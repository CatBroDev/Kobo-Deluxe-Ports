<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Kobo Deluxe browser edition</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080c14;color:#eafcff;font:16px system-ui}canvas{display:block;width:min(100vw,133.333vh);height:min(75vw,100vh);margin:auto;image-rendering:pixelated;touch-action:none;outline:none}.embedded body{height:100vh;display:grid;place-items:center;overflow:hidden}.embedded .outside{display:none}button{min-height:44px;padding:8px 16px}.outside{padding:12px}a{color:#8edaff}</style></head><body>

<script>window.logs=[];window.errors=[];const zh=new URLSearchParams(location.search).get('lang')?.startsWith('zh');var Module={canvas:document.querySelector('#canvas'),noInitialRun:true,arguments:['-files','/data','-nofullscreen','-nomouse','-nojoystick','-nocached_sounds','-width','640','-height','480','-countdown','1'],print:s=>logs.push(s),printErr:s=>errors.push(s),locateFile:(name,prefix)=>prefix+(/\.(wasm|data)$/.test(name)?name+'.bin':name),setStatus:text=>{document.querySelector('#loading').textContent=zh?'正在启动游戏…':'Starting game…';}};Module.setStatus('');</script>
